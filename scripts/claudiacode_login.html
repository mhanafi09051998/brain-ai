<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claudia Code — OAuth & Account Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              900: '#4c1d95',
              950: '#2e1065',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #080c14; font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100 antialiased">

  <div class="max-w-md w-full bg-[#101626] border border-slate-800/80 rounded-2xl p-8 shadow-2xl shadow-purple-950/20 relative overflow-hidden">
    
    <!-- Background ambient glow -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header Logo -->
    <div class="text-center mb-8 relative">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-cyan-500 shadow-lg shadow-brand-500/30 mb-4">
        <i class="fa-solid fa-bolt text-2xl text-white"></i>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Claudia Code</h1>
      <p class="text-sm text-slate-400 mt-1">Autonomous Terminal IDE & Frontier Reasoning</p>
    </div>

    <!-- Tabs -->
    <div class="flex rounded-xl bg-slate-900/80 p-1 border border-slate-800 mb-6">
      <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-white bg-brand-600 shadow-sm">Sign In</button>
      <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white">Create Account</button>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border"></div>

    <!-- Login Form -->
    <form id="form-login" onsubmit="handleAuth(event, 'login')" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username or Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-sm">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" id="login-identifier" required placeholder="owner / dev@zolu.my.id" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-colors">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-sm">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-colors">
        </div>
      </div>

      <button type="submit" id="btn-login" class="w-full bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 mt-2">
        <span>Authorize & Sign In</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <!-- Register Form -->
    <form id="form-register" onsubmit="handleAuth(event, 'register')" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Full Name</label>
        <input type="text" id="reg-name" required placeholder="Hanafi" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-colors">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
        <input type="text" id="reg-username" required placeholder="mhanafi" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-colors">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
        <input type="email" id="reg-email" required placeholder="mhanafi09051998@gmail.com" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-colors">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <input type="password" id="reg-password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition-colors">
      </div>

      <button type="submit" id="btn-register" class="w-full bg-gradient-to-r from-cyan-600 to-brand-600 hover:from-cyan-500 hover:to-brand-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-lg shadow-cyan-600/30 flex items-center justify-center gap-2 mt-2">
        <span>Create Account & Authorize</span>
        <i class="fa-solid fa-user-plus text-xs"></i>
      </button>
    </form>

    <!-- Success Screen (Post Auth) -->
    <div id="auth-success" class="hidden text-center py-4 space-y-4">
      <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto text-emerald-400 text-2xl">
        <i class="fa-solid fa-check"></i>
      </div>
      <h3 class="text-xl font-bold text-white">Authenticated!</h3>
      <p class="text-xs text-slate-400">Welcome back, <span id="succ-user" class="font-bold text-brand-300"></span>. Redirecting to your terminal CLI...</p>
      <div id="manual-token-box" class="mt-4 p-3 bg-slate-900 rounded-xl border border-slate-800 text-left">
        <p class="text-[11px] text-slate-500 uppercase font-bold tracking-wider mb-1">Session Token</p>
        <div class="flex items-center gap-2">
          <input type="text" id="token-display" readonly class="w-full bg-slate-950 px-2.5 py-1.5 text-xs text-brand-300 mono rounded border border-slate-800">
          <button onclick="copyToken()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded text-white"><i class="fa-regular fa-copy"></i></button>
        </div>
      </div>
    </div>

    <!-- Footer Security Notice -->
    <div class="mt-8 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500 flex items-center justify-center gap-2">
      <i class="fa-solid fa-shield-halved text-brand-500"></i>
      <span>Protected by Claudia Zero-Trust OAuth Engine</span>
    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const oauthCallback = urlParams.get('oauth_callback');

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('form-login').classList.toggle('hidden', !isLogin);
      document.getElementById('form-register').classList.toggle('hidden', isLogin);
      
      document.getElementById('tab-login').className = isLogin 
        ? 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-white bg-brand-600 shadow-sm'
        : 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white';
        
      document.getElementById('tab-register').className = !isLogin 
        ? 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-white bg-brand-600 shadow-sm'
        : 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white';
        
      document.getElementById('alert-box').classList.add('hidden');
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alert-box');
      box.textContent = msg;
      box.className = isError 
        ? 'mb-4 p-3 rounded-lg text-xs font-medium border bg-rose-950/50 border-rose-800 text-rose-300'
        : 'mb-4 p-3 rounded-lg text-xs font-medium border bg-emerald-950/50 border-emerald-800 text-emerald-300';
      box.classList.remove('hidden');
    }

    function handleAuth(e, mode) {
      e.preventDefault();
      
      let username, email;
      if (mode === 'login') {
        const idVal = document.getElementById('login-identifier').value.trim();
        const isEmail = idVal.includes('@');
        username = isEmail ? idVal.split('@')[0] : idVal;
        email = isEmail ? idVal : `${username.toLowerCase()}@zolu.my.id`;
      } else {
        username = document.getElementById('reg-username').value.trim();
        email = document.getElementById('reg-email').value.trim();
      }

      const token = 'cc_live_' + btoa(username + ':' + Date.now()).replace(/=/g, '');

      // Hide forms, show success
      document.getElementById('form-login').classList.add('hidden');
      document.getElementById('form-register').classList.add('hidden');
      document.getElementById('tab-login').parentElement.classList.add('hidden');
      document.getElementById('auth-success').classList.remove('hidden');
      document.getElementById('succ-user').textContent = `${username} (${email})`;
      document.getElementById('token-display').value = token;

      // Save locally
      localStorage.setItem('claudia_user', JSON.stringify({ username, email, token }));

      // Redirect if OAuth callback exists
      if (oauthCallback) {
        const target = new URL(oauthCallback);
        target.searchParams.set('token', token);
        target.searchParams.set('username', username);
        target.searchParams.set('email', email);
        target.searchParams.set('plan', 'Apex Master');
        
        setTimeout(() => {
          window.location.href = target.toString();
        }, 800);
      }
    }

    function copyToken() {
      const copyText = document.getElementById("token-display");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      showAlert("Copied token to clipboard!", false);
    }
  </script>
</body>
</html>
